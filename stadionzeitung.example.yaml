# Stadionzeitung (Staffelberg-Kicker) of FC Sturm Hauzenberg: every PDF the
# InDesign document links, regenerated with
#
#   stadionzeitung-automation -config stadionzeitung.yaml
#
# Each team needs its bfv.de page (and its FuPa page for the FuPa PDFs);
# then list the PDFs you want. They are written to outDir as
# <Art>-<Team>.pdf, e.g. Tabelle-H1.pdf, and for the next opponent as
# <Art>-<Team>-Gast.pdf. See the README for what each PDF shows.

# The folder the InDesign document links its graphics from. It must exist.
outDir: C:/Users/<user>/OneDrive/Stadionzeitung/Dateien

# The layout's font; without these lines the built-in Go font is used.
fonts:
  regular: C:/Windows/Fonts/calibri.ttf
  bold: C:/Windows/Fonts/calibrib.ttf

# The club's bfv.de page, for the youth pages (S. 21, 23):
# Jugend-Ergebnisse.pdf and Jugend-Vorschau.pdf.
club: https://www.bfv.de/vereine/fc-sturm-hauzenberg/00ES8GNI7C00000KVV0AG08LVUPGND5I
jugend: [ergebnisse, vorschau]

# PDFs per team, from BFV:
#   spieltage  previous, current and next matchday   Spielplan-<Team>.pdf
#   tabelle    league table                          Tabelle-<Team>.pdf
#   spielplan  season schedule                       Saisonspielplan-<Team>.pdf
#   torjaeger  top scorers (from FuPa if set)        Torjaeger-<Team>.pdf
# and from FuPa, only with FuPa's written permission (see the README):
#   kader              squad with coaches and staff  Kader-<Team>.pdf
#   liga-torjaeger     top scorers of the league     Liga-Torjaeger-<Team>.pdf
#   tabelle-torjaeger  table with the league's top   Tabelle-Torjaeger-<Team>.pdf
#                      scorers below (S. 13, 29)
#   schiedsrichter     referee of the next match     Schiedsrichter-<Team>.pdf
#   seite              the team's whole page: name, team photo, staff,
#                      squad and top scorers (S. 11, 27)  Seite-<Team>.pdf
# name: the headline of the team's seite (default: its name on BFV).
# gast: for the next league opponent, i.e. the guest (S. 5):
#   seite      the guest's whole page, with its coaches  Seite-<Team>-Gast.pdf
#   kader, torjaeger  parts of it, separately        Kader-<Team>-Gast.pdf, …

teams:
  H1:                                 # 1. Mannschaft, Landesliga Mitte
    bfv: https://www.bfv.de/mannschaften/fc-sturm-hauzenberg/016PE85GAS000000VV0AG811VTE5EA5R
    fupa: https://www.fupa.net/team/fc-sturm-hauzenberg-m1
    name: FC Sturm Hauzenberg I
    pdfs: [spieltage, tabelle-torjaeger, spielplan, seite, schiedsrichter]
    gast: [seite]
    roles: [Trainer, Torwart-Trainer, Fitnesstrainer, Betreuer]

  H2:                                 # 2. Mannschaft, Kreisliga Passauer Land
    bfv: https://www.bfv.de/mannschaften/fc-sturm-hauzenberg-2/02T8FR5G5O000000VS5489BRVSH2JAIF
    fupa: https://www.fupa.net/team/fc-sturm-hauzenberg-m2
    name: FC Sturm Hauzenberg II
    pdfs: [spieltage, tabelle-torjaeger, spielplan, seite]
    roles: [Trainer, Torwart-Trainer, Physiotherapeut]

  H3:                                 # SG Haag I / Hauzenberg III, A-Klasse
    bfv: https://www.bfv.de/mannschaften/sg-haag-1-hauzenberg-3/016PBL2NIG000000VV0AG80NVV8OQVTB
    # The SG's FuPa page only works with the season in its name: update
    # "2026-27" each summer.
    fupa: https://www.fupa.net/team/sg-haag-hauzenberg-m1-2026-27
    name: SG Haag I / Hauzenberg III
    pdfs: [spieltage, tabelle, spielplan, seite]
