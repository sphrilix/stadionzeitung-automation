name: Release

# A pushed v* tag releases the Windows binary only. To add other platforms to
# a release, run this workflow manually with the tag and the platforms.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.1.0
        required: true
      platforms:
        description: "Space-separated: windows_amd64 linux_amd64 linux_arm64 darwin_amd64 darwin_arm64"
        default: windows_amd64

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  platforms:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - id: list
        env:
          PLATFORMS: ${{ inputs.platforms || 'windows_amd64' }}
        run: |
          for p in $PLATFORMS; do
            case $p in
              windows_amd64|linux_amd64|linux_arm64|darwin_amd64|darwin_arm64) ;;
              *) echo "::error::unsupported platform $p"; exit 1 ;;
            esac
          done
          echo "matrix=$(jq -cn --arg p "$PLATFORMS" '$p | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  build:
    needs: platforms
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0 # git describe needs the tag
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.platform }}
          repository-cache: true
      - name: Build
        run: bazel build --config=release --platforms=@rules_go//go/toolchain:${{ matrix.platform }} //cmd/bfv-miner
      - name: Package
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          bin=$(bazel cquery --config=release --platforms=@rules_go//go/toolchain:$PLATFORM --output=files //cmd/bfv-miner)
          name=bfv-miner_${TAG}_${PLATFORM}
          mkdir -p "$name" dist
          cp "$bin" "$name/"
          cp README.md stadionzeitung.example.json "$name/"
          if [[ $PLATFORM == windows_* ]]; then
            zip -r "dist/$name.zip" "$name"
          else
            tar -czf "dist/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --generate-notes dist/*
          fi
          # Checksums cover every archive of the release, not just this run's.
          mkdir all
          gh release download "$TAG" --pattern 'bfv-miner_*' --dir all
          (cd all && sha256sum *) > checksums.txt
          gh release upload "$TAG" --clobber checksums.txt
